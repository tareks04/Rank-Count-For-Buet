name: Build, Deploy & Release (Web + Android APK)

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag name to publish a GitHub Release with APK & Web bundle (e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-and-release
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Type-check
        run: npm run lint

      - name: Build production web bundle
        env:
          VITE_GITHUB_REPO: ${{ github.repository }}
        run: npm run build

      - name: Package release archives
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          fi
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          mkdir -p release-artifacts
          tar -czf "release-artifacts/pcm-nationwide-rank-estimator-${TAG}.tar.gz" -C dist .
          (cd dist && zip -qr "../release-artifacts/pcm-nationwide-rank-estimator-${TAG}.zip" .)

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Upload web release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: release-artifacts/*

  build-android-apk:
    needs: verify-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle for Android
        env:
          VITE_GITHUB_REPO: ${{ github.repository }}
        run: npm run build

      - name: Generate and sync Capacitor Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android APK
        id: apk
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          TAG="${{ needs.verify-and-build.outputs.version }}"
          mkdir -p apk-artifacts
          OUT_APK="apk-artifacts/pcm-nationwide-rank-estimator-${TAG}.apk"

          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/release.keystore
            (cd android && ./gradlew assembleRelease)
            APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner | sort -V | tail -n 1)"
            "$APKSIGNER" sign \
              --ks android/release.keystore \
              --ks-pass "pass:${ANDROID_KEYSTORE_PASSWORD}" \
              --ks-key-alias "${ANDROID_KEY_ALIAS}" \
              --key-pass "pass:${ANDROID_KEY_PASSWORD}" \
              --out "$OUT_APK" \
              android/app/build/outputs/apk/release/app-release-unsigned.apk
            rm -f android/release.keystore
          else
            (cd android && ./gradlew assembleDebug)
            cp android/app/build/outputs/apk/debug/app-debug.apk "$OUT_APK"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apk-artifacts/*.apk

  deploy-pages:
    needs: verify-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish-release:
    needs: [verify-and-build, build-android-apk, deploy-pages]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download web release bundle
        uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: release-artifacts

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-artifacts

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: PCM Nationwide Rank Estimator ${{ inputs.release_tag || github.ref_name }}
          body: |
            ### Downloads
            - **Android App (`.apk`)**: Download `pcm-nationwide-rank-estimator-${{ needs.verify-and-build.outputs.version }}.apk` from the Assets below to install directly on Android.
            - **Web Static Bundle**: `.tar.gz` and `.zip` production builds of `dist/`.
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release-artifacts/*.apk
            release-artifacts/*.tar.gz
            release-artifacts/*.zip
